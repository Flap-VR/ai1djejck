name: UltraHome
version: 1.0-SNAPSHOT
main: com.ultrahome.UltraHome
api-version: 1.20
commands:
  sethome:
    description: Set your home
    usage: /sethome [name]
  home:
    description: Teleport to home or open homes GUI
    usage: /home [name]
  homes:
    description: Open homes GUI
    usage: /homes
  delhome:
    description: Delete a home
    usage: /delhome 
