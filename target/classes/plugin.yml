name: UltraHome
version: 1.0
main: com.ultrahome.UltraHome
api-version: '1.20'
commands:
  sethome:
    description: Set your home location
    usage: /sethome [name]
  home:
    description: Teleport to your home
    usage: /home [name]
  delhome:
    description: Delete a home
    usage: /delhome [name]
